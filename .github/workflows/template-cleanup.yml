# Convierte un repositorio creado desde la plantilla en un proyecto: deja en main la
# variante elegida, renombrada, y borra las demás ramas y todo lo que solo sirve a la
# plantilla, este workflow incluido. Se lanza a mano, una sola vez:
#
#   gh workflow run template-cleanup.yml -R <owner>/<repo> -f variante=full -f company=Acme -f product=Billing
#
# Para elegir full o multitenant, el repositorio ha de crearse con todas las ramas
# (gh repo create --include-all-branches, o «Include all branches» en la web).
#
# Este fichero no debe contener el nombre de la plantilla: el renombrado lo modificaría,
# y GitHub no deja que el GITHUB_TOKEN cree ni modifique workflows, solo borrarlos.
# scripts/verify-template.sh lo comprueba.
name: Template cleanup

on:
  workflow_dispatch:
    inputs:
      variante:
        description: Rama de la plantilla de la que parte el proyecto
        type: choice
        options: [main, full, multitenant]
        default: full
      company:
        description: Empresa, como identificador C# (Acme)
        type: string
        required: true
      product:
        description: Producto, como identificador C# (Billing)
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: template-cleanup

jobs:
  cleanup:
    # Nunca en la propia plantilla. Si su repositorio cambia de nombre, cambiarlo aquí.
    if: github.repository != 'luis-veliz/dotnet-api-template' && !github.event.repository.is_template
    runs-on: ubuntu-latest
    env:
      # Por variables de entorno y no interpolados en los scripts: así un valor con
      # comillas o $( ) no puede inyectar órdenes.
      VARIANTE: ${{ inputs.variante }}
      COMPANY: ${{ inputs.company }}
      PRODUCT: ${{ inputs.product }}
    steps:
      # Fijada por SHA: este job tiene contents: write. Dependabot propone las subidas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Partir de la variante
        run: |
          if ! git rev-parse --verify --quiet "origin/$VARIANTE" >/dev/null; then
            echo "::error::La rama '$VARIANTE' no existe. Crea el repositorio con todas las ramas (--include-all-branches)."
            exit 1
          fi
          git checkout -B main "origin/$VARIANTE"

      - name: Renombrar y retirar lo propio de la plantilla
        run: bash setup-template.sh "$COMPANY" "$PRODUCT"

      - name: Confirmar en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🎉 chore: ${COMPANY}.${PRODUCT} creado desde la plantilla (${VARIANTE})"
          # Con lease: si alguien empujó a main después del checkout, falla en vez de
          # descartar ese commit en silencio.
          git push --force-with-lease origin HEAD:main

      - name: Borrar las demás ramas
        run: |
          for rama in full multitenant; do
            if git ls-remote --exit-code --heads origin "$rama" >/dev/null; then
              git push origin --delete "$rama"
            fi
          done